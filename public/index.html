<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FSexp9.1 - CI Dashboard</title>
  <style>
    body { background:#0d1020; color:#fff; font-family:Arial, sans-serif; padding:30px; }
    h2 { margin-bottom:5px; }
    p.sub { color:#9aa3c7; margin-top:0; }
    input, select, button { padding:10px; margin:5px; border-radius:6px; border:none; font-size:14px; }
    button { background:#5b5bf0; color:#fff; cursor:pointer; }
    button:hover { background:#4a4ad8; }
    button.defect { background:#ef4444; }
    pre { background:#000; color:#4fd1c5; padding:15px; border-radius:8px; min-height:80px; }
  </style>
</head>
<body>
  <h2>FSexp9.1</h2>
  <p class="sub">Build • Test • Early Defect Prevention</p>

  <div>
    <button onclick="preset(45,'+',55)">Test Addition (45 + 55)</button>
    <button onclick="preset(12,'*',12)">Test Multiplication (12 × 12)</button>
    <button class="defect" onclick="preset(100,'/',0)">Trigger Defect: Zero Division (100 / 0)</button>
  </div>

  <div>
    <input id="a" type="number" value="45">
    <select id="op">
      <option value="+">+ (Addition)</option>
      <option value="-">- (Subtraction)</option>
      <option value="*">* (Multiplication)</option>
      <option value="/">/ (Division)</option>
    </select>
    <input id="b" type="number" value="55">
  </div>

  <div>
    <button onclick="calc()">Send POST /api/calculate</button>
    <button onclick="health()">Check Health (/health)</button>
  </div>

  <pre id="out">// Click "Send POST /api/calculate" to test backend endpoints.</pre>

<script>
const out = document.getElementById('out');

function preset(a, op, b) {
  document.getElementById('a').value = a;
  document.getElementById('op').value = op;
  document.getElementById('b').value = b;
  calc();
}

async function calc() {
  const body = {
    a: document.getElementById('a').value,
    operator: document.getElementById('op').value,
    b: document.getElementById('b').value
  };
  const r = await fetch('/api/calculate', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  out.textContent = r.status + ' ' + JSON.stringify(await r.json(), null, 2);
}

async function health() {
  const r = await fetch('/health');
  out.textContent = r.status + ' ' + JSON.stringify(await r.json(), null, 2);
}
</script>
</body>
</html>
